<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    <Directory /var/www/html/public/uploads>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php[0-9]?|phtml|phar|cgi|pl|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
ServerSignature Off
